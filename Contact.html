                    <section class="hero">
                    
                        <h1>Experience the Living History of Lesotho</h1>
                        </section><main><section class="intro">
                            <h2>Contact Form</h2>
                            <p>We would love to hear from you. Please note that online message delivery is not yet available.</p>
                        </section>
                        <form class="contact-form" action="#" method="post">
                            <div class="form-group"><label for="fullname">Full Name</label>
                                <input id="fullname" name="fullname" type="text" autocomplete="name" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="country">Country</label>
                                <select id="country" name="country" required>
                                    <option value="">Select your country</option>
                                    <option value="Lesotho">Lesotho</option>
                                    <option value="South Africa">South Africa</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <fieldset>
                                <legend>Gender (optional)</legend>
                                <label class="radio">
                                    <input type="radio" name="gender" value="male"> Male</label>
                                    <label class="radio"><input type="radio" name="gender" value="female"> Female</label>
                                </fieldset><div class="form-group"><label for="message">Message</label>
                                    <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>
                                </div><button type="submit">Submit Message</button>
                            </form>
                            <script src="javascript.js"></script>
                        </main>
                        <footer class="footer">Echoes of the Past</footer>
                    </body>
                    </html>
